<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="myntra bag.css">    
</head>
<body>
    <button class="bag-button" onclick="cartQuantity+=1;
    document .querySelector('#CART-SUMMARY').innerText=`YOUR BAG HAS ${cartQuantity} ITEMS`;">Add to bag</button>
    <button class="wish-button" onclick="cartQuantity-=1;
    document .querySelector('#CART-SUMMARY').innerText=`YOUR BAG HAS ${cartQuantity} ITEMS`;">❤️ move to wishlist</button>
    <button class="bag-button" onclick="cartQuantity+=2;
    document .querySelector('#CART-SUMMARY').innerText=`YOUR BAG HAS ${cartQuantity} ITEMS`;">Add 1+1 sale item</button>
    <h1 id="CART-SUMMARY">YOUR BAG HAS 0 ITEMS</h1>
    <script>
        let cartQuantity=0;
        document .querySelector('#CART-SUMMARY').innerText=`YOUR BAG HAS ${cartQuantity} ITEMS`;
    </script>
</body>
</html>
